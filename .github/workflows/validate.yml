name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package structure and references
        run: node skills/ai-ui-ux-motion-engine/scripts/validate-package.mjs
      - name: Validate cinematic brief and prompt generation
        run: |
          node skills/ai-ui-ux-motion-engine/scripts/validate-cinematic-brief.mjs \
            skills/ai-ui-ux-motion-engine/assets/cinematic-brief.example.json
          node skills/ai-ui-ux-motion-engine/scripts/render-cinematic-prompt.mjs \
            skills/ai-ui-ux-motion-engine/assets/cinematic-brief.example.json \
            --mode flagship > /tmp/cinematic-prompt.txt
          grep -q "IDENTITY LOCK" /tmp/cinematic-prompt.txt
          grep -q "SHOT 4" /tmp/cinematic-prompt.txt
      - name: Validate cinematic media preparation script
        run: |
          bash -n skills/ai-ui-ux-motion-engine/scripts/prepare-scroll-media.sh
          bash skills/ai-ui-ux-motion-engine/scripts/prepare-scroll-media.sh --help \
            | grep -q "silent all-intra H.264"
      - name: Run motion-safety self-audit
        run: node skills/ai-ui-ux-motion-engine/scripts/audit-motion-safety.mjs .
      - name: Exercise every portable installer target
        run: |
          test_root="$(mktemp -d)"
          targets="codex claude cursor antigravity antigravity-cli gemini copilot vscode cline roo opencode windsurf amp zed goose agents"
          for target in $targets; do
            destination="$test_root/$target"
            ./scripts/install-skill.sh \
              --target "$target" \
              --scope project \
              --destination "$destination"
            test -f "$destination/ai-ui-ux-motion-engine/SKILL.md"
          done
